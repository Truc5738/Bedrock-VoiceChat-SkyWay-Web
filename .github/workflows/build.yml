name: Build

on:
  push:
    branches: [ main, standalone-bedrock-voice-chat ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'
      - name: Build Paper plugin and Java voice client
        run: |
          gradle build --no-daemon
          gradle :voice-client:build --no-daemon
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-VoiceChannel
          path: build/libs/*.jar
      - name: Upload Java voice client
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-VoiceChannel-VoiceClient
          path: voice-client/build/libs/*.jar
      - name: Set up Java 17 for Android Gradle Plugin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13 for Android Gradle Plugin
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build Android Bedrock voice client
        run: gradle -p voice-client-android :app:assembleDebug --no-daemon
      - name: Upload Android Bedrock voice client
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-VoiceChannel-Bedrock-Android
          path: voice-client-android/app/build/outputs/apk/debug/*.apk
